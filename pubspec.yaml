name: crm_app
description: "CRM App with automatic call recording and log management."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Permissions
  permission_handler: ^11.3.1

  # File paths for recordings
  path_provider: ^2.1.3
  path: ^1.9.0

  # Audio playback
  just_audio: ^0.9.40

  # Date formatting (call log timestamps)
  intl: ^0.19.0

  # HTTP – calls to FastAPI backend
  http: ^1.2.0

  # Local SQLite cache (remove if Flutter never reads/writes data offline)
  # sqflite: ^2.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true